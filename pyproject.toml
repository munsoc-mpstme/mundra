[project]
name = "mundra"
version = "1.0.0"
description = "MUNSoc Delegate Resource Application - centralized backend for delegate management, event planning and communication"
readme = "README.md"
requires-python = ">=3.12"

# Direct dependencies only. Transitive pins live in uv.lock; regenerate with `uv lock`.
#
# Deliberately NOT fastapi[standard]: that extra pulls fastapi-cli ->
# fastapi-cloud-cli -> sentry-sdk into production. The pieces this app actually
# uses (uvicorn, jinja2, python-multipart, email-validator) are listed directly,
# and fastapi-cli lives in the dev group for `fastapi dev`.
dependencies = [
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "fastapi-mail>=1.6.8",
    "jinja2>=3.1.6",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.32",
    "qrcode>=8.2",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "fastapi-cli>=0.0.32",
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
]
